<header class="app-header-inner">
    <div class="header-main">
        <div class="brand-section">
            <div class="rooster-icon">🐓</div>
            <div>
                <div class="brand-title">{{farmName()}}</div>
                <div class="batch-tag" [ngClass]="batchStatus() ? 'active' : 'closed'"
                    [title]="batchStatus() ? 'Active' : 'Closed'"> BATCH: {{batchCode()}} </div>
            </div>
        </div>
        <div class="user-section">
            <div class="welcome-text">Welcome {{userFullName()}}</div>
            <div class="header-buttons">
                <button class="btn-header" [routerLink]="['/home']" routerLinkActive="active">Home</button>
                <button class="btn-header" (click)="logout()">Logout</button>
            </div>
        </div>
    </div>
</header>
